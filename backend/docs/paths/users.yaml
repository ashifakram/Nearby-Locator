ExportAccount:
  post:
    operationId: exportAccount
    tags: [Users]
    summary: Request asynchronous GDPR/CCPA personal data export
    security:
      - BearerAuth: []
    responses:
      '202':
        description: Account export job accepted for background processing

ExportStatus:
  get:
    operationId: getExportStatus
    tags: [Users]
    summary: Get status of data export request
    security:
      - BearerAuth: []
    responses:
      '200':
