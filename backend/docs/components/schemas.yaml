User:
  type: object
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      format: email
    name:
      type: string
    status:
      type: string
      enum: [PENDING_VERIFICATION, ACTIVE, LOCKED, DISABLED, BANNED]
    role_id:
      type: string
      format: uuid
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
  required: [id, email, name, status, role_id, created_at, updated_at]

DeviceSession:
  type: object
  properties:
    id:
      type: string
      format: uuid
    ip_address:
      type: string
    user_agent:
      type: string
    last_active:
      type: string
      format: date-time
    metadata:
      type: object
  required: [id, ip_address, user_agent, last_active, metadata]

Permission:
  type: string
  example: users.read

Role:
  type: object
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    is_system:
      type: boolean
    priority:
      type: integer
    created_at:
      type: string
      format: date-time
  required: [id, name, is_system, priority, created_at]

Pagination:
  type: object
  properties:
    records:
      type: array
      items: {}
    total:
      type: integer
    cursor:
      type: ["string", "null"]

StandardSuccess:
  type: object
  properties:
    success:
      type: boolean
      example: true
    status:
      type: integer
      example: 200
    message:
      type: string
    data:
      type: ["object", "null"]
    error:
      type: ["object", "null"]
      example: null
  required: [success, status, message, data, error]

StandardError:
  type: object
  properties:
    success:
      type: boolean
      example: false
    status:
      type: integer
      example: 400
    message:
      type: string
    data:
      type: ["object", "null"]
      example: null
    error:
      type: object
      properties:
        code:
          type: string
        details:
          type: ["object", "null"]
      required: [code, details]
  required: [success, status, message, data, error]

ValidationError:
  allOf:
    - $ref: '#/StandardError'
  description: A standard error where the code is VALIDATION_ERROR and details contain specific field violations.
