openapi: 3.1.0
info:
  title: Nearby Locator API
  version: 1.0.0
  license:
    name: Proprietary
  description: |
    # Authentication Lifecycle
    1. **Signup:** User registers (`POST /auth/signup`). Status becomes `PENDING_VERIFICATION`.
    2. **Email Verification:** User verifies email. Status becomes `ACTIVE`.
    3. **Login:** User authenticates (`POST /auth/login`). Receives short-lived Access Token (JWT) and a secure `HttpOnly` Refresh Cookie.
    4. **Protected APIs:** Client attaches `Authorization: Bearer <token>` to requests.
    5. **Refresh:** Client calls `POST /auth/refresh` (passing CSRF headers). The backend validates the `HttpOnly` cookie and issues a fresh Access Token and rotated Refresh Cookie.
    6. **Logout:** Client calls `POST /auth/logout` to revoke the session family and clear cookies.
servers:
  - url: /api
    description: Base API URL
security:
  - BearerAuth: []
paths:
