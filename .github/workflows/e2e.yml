name: E2E Tests (Playwright)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: nearby_locator_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nearby_locator_test
      JWT_SECRET: ci-test-secret-key
      USE_REAL_SMTP: "false"
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'SuperAdmin@123' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: ./backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run DB migrations
        run: npm run migrate
        working-directory: ./backend
        env:
          NODE_ENV: test

      - name: Seed test data
        run: node seed_sample_spots.js
        working-directory: ./backend
        env:
          NODE_ENV: test
        continue-on-error: true

      - name: Run Playwright tests
        run: npm test
        env:
          CI: "true"

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload JUnit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: test-results/junit.xml
          retention-days: 30

      - name: Upload Test Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: test-results/**/*.png
          retention-days: 14

      - name: Publish JUnit Results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'test-results/junit.xml'
          check_name: 'E2E Test Results'
